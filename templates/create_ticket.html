{% extends 'base.html' %}{% block title %}Create Ticket{% endblock %}{% block content %}<div class="narrow"><p class="eyebrow">Employee Portal</p><h1>Create Support Ticket</h1><section class="panel"><form method="post"><label>Title</label><input name="title" value="{{form.get('title','')}}" required><label>Description</label><textarea name="description" rows="7" required>{{form.get('description','')}}</textarea><label>Priority</label><select name="priority" required><option value="">Select priority</option>{% for p in ['Low','Medium','High'] %}<option {% if form.get('priority')==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select><div class="actions"><a class="button secondary" href="{{url_for('dashboard')}}">Cancel</a><button>Submit Ticket</button></div></form></section></div>{% endblock %}
