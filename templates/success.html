{% extends 'base.html' %}
{% block title %}Success{% endblock %}
{% block content %}
<div class="success">
  <div class="check">✓</div>
  <p class="eyebrow">Success</p>
  <h1>Ticket submitted</h1>
  <p>Your support ticket has been created successfully.</p>
  <strong>Ticket ID: #{{ticket._id|string|truncate(8,true,'')}}</strong>
  <div class="actions center">
    <a class="button secondary" href="{{url_for('my_tickets')}}">View My Tickets</a>
    <a class="button" href="{{url_for('ticket_details',ticket_id=ticket._id)}}">View Ticket</a>
  </div>
</div>
{% endblock %}
